name: revista-producao
x-backend: &backend
  image: revista-psicologia-backend:${APP_VERSION:-local}
  build:
    context: ./backend
    dockerfile: Dockerfile.production
  env_file: ${PRODUCTION_ENV_FILE:-.env.production}
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    PRIVATE_STORAGE_ROOT: /storage
    USE_X_ACCEL_REDIRECT: "true"
    TRUST_PROXY_IP: "true"
  volumes:
    - private_storage:/storage
    - static_files:/app/staticfiles
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: sh -c "/app/.venv/bin/python manage.py migrate --noinput && /app/.venv/bin/python manage.py collectstatic --noinput"
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *backend
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    <<: *backend
    restart: unless-stopped
    command: sh -c "/app/.venv/bin/python manage.py requeue_uploads && exec /app/.venv/bin/celery -A config worker --loglevel=INFO --concurrency=1 --max-tasks-per-child=20 --max-memory-per-child=400000"
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, '/app/.venv/bin/celery -A config inspect ping -d celery@$$HOSTNAME --timeout=5 > /dev/null']
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    stop_grace_period: 130s
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    image: revista-psicologia-web:${APP_VERSION:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile.production
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      NGINX_ENVSUBST_FILTER: ^(PUBLIC_ORIGIN)$$
    ports:
      - "${HTTP_BIND:-127.0.0.1:15080}:8080"
      - "${HTTPS_BIND:-127.0.0.1:15443}:8443"
    volumes:
      - ${TLS_CERTS_DIR:-./deploy/certs}:/etc/nginx/certs:ro
      - private_storage:/storage:ro
      - static_files:/srv/static:ro
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/health/live']
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  redis_data:
  private_storage:
  static_files:
